<!DOCTYPE html> <!-- HTML 문서의 시작을 알리는 선언 -->
<html> <!-- HTML 문서 전체를 감싸는 루트 요소 -->

<body> <!-- 실제 화면에 표시될 내용이 시작되는 영역 -->

  <script>
    console.log("첫번째 <script> 시작"); // 첫번째 script 태그 실행 시점 기준점

    console.log('1. <h1 id="subject">제목</h1> 요소: ', document.getElementById("subject"));

    console.log('2. <p id="content">문단</p> 요소: ', document.getElementById("content"));
  </script>

  <h1 id="subject">제목</h1>

  <script>
    console.log("두번째 <script> 시작"); // 두번째 script 태그 실행 시점 기준점

    console.log('1. <h1 id="subject">제목</h1> 요소: ', document.getElementById("subject"));

    console.log('2. <p id="content">문단</p> 요소: ', document.getElementById("content"));
  </script>

  <p id="content">내용</p>

  <script>
    console.log("세번째 <script> 시작"); // 세번째 script 태그 실행 시점 기준점

    console.log('1. <h1 id="subject">제목</h1> 요소: ', document.getElementById("subject"));

    console.log('2. <p id="content">문단</p> 요소: ', document.getElementById("content"));
  </script>

</body>

</html>
